<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="SalonOS — онлайн-запись для салонов">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>SalonOS</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}
    .shell{width:min(960px,100%);margin:auto;padding:24px 16px}
    .hero{background:#111827;color:white;border-radius:24px;padding:28px;margin-bottom:16px}
    .hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#cbd5e1}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px}
    .card strong{display:block;margin-bottom:6px}.muted{color:#64748b}
    #status{margin-top:18px;font-size:14px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.shell{padding:14px}.hero{border-radius:18px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>SalonOS</h1>
      <p>Удобная онлайн-запись и управление салоном.</p>
      <div id="status">Проверяем сервер…</div>
    </section>
    <section class="grid">
      <article class="card"><strong>📅 Онлайн-запись</strong><span class="muted">Клиент выбирает услугу, мастера и свободное время.</span></article>
      <article class="card"><strong>👥 Управление</strong><span class="muted">Мастера, услуги, расписание и записи в одном месте.</span></article>
      <article class="card"><strong>🤖 AI-помощник</strong><span class="muted">Будет подключён через защищённый API.</span></article>
    </section>
  </main>
  <script>
    async function boot(){
      const status=document.getElementById("status");
      try{
        const response=await fetch("/api/health",{cache:"no-store"});
        if(!response.ok) throw new Error("HTTP "+response.status);
        const data=await response.json();
        status.textContent=data.ok?"Система работает":"Сервер недоступен";
      }catch(error){
        status.textContent="Не удалось связаться с сервером";
        console.error(error);
      }
    }
    boot();
    if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(console.error);
  </script>
</body>
</html>
