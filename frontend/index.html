<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed"><meta name="description" content="SalonOS — онлайн-запись и управление салоном">
<link rel="manifest" href="/manifest.webmanifest"><title>SalonOS</title>
<style>
:root{--accent:#7c3aed;--bg:#f6f7fb;--surface:#fff;--text:#17171c;--muted:#71717a;--line:#e4e4e7;--radius:20px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}
a{text-decoration:none;color:inherit}.hidden{display:none!important}.app{min-height:100vh}.wrap{width:min(1180px,100%);margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900}.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:700}.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#dc2626}.btn.small{padding:9px 12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 8px 30px #00000006}.muted{color:var(--muted)}.hero{padding:42px 34px;border-radius:28px;background:var(--surface);border:1px solid var(--line);margin-bottom:16px}.hero h1{font-size:clamp(34px,7vw,66px);line-height:1;margin:0 0 14px;letter-spacing:-.05em}.hero p{font-size:18px;color:var(--muted);max-width:650px}.section{margin:34px 0}.section h2{font-size:25px;margin:0 0 14px}.service{display:flex;justify-content:space-between;gap:15px;align-items:center}.service+.service{margin-top:10px}.price{font-weight:800;white-space:nowrap}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:10px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}.chip.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);font-weight:700}.masters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.master img,.avatar{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#e4e4e7}.avatar{display:grid;place-items:center;font-size:28px;font-weight:800;color:#52525b}.master strong{display:block;margin-top:10px}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:24px;padding:22px}.steps{display:flex;gap:7px;margin:12px 0 20px}.step{height:5px;flex:1;border-radius:9px;background:var(--line)}.step.on{background:var(--accent)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.admin{display:grid;grid-template-columns:220px 1fr;gap:18px}.side{position:sticky;top:18px;height:max-content}.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:12px;color:var(--muted);font-weight:700}.navbtn.active,.navbtn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat b{font-size:30px;display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.theme{padding:12px;border:2px solid var(--line);border-radius:16px}.theme.active{border-color:var(--accent)}.theme-preview{height:75px;border-radius:11px;margin-bottom:8px}.toast{position:fixed;right:18px;bottom:18px;background:#18181b;color:white;padding:13px 16px;border-radius:14px;z-index:50}.public.light{}.public.dark{--bg:#0b0b0e;--surface:#151519;--text:#fafafa;--muted:#a1a1aa;--line:#2b2b31}.public.soft{--bg:#fff8fb;--surface:#fff;--text:#3d2630;--muted:#876f78;--line:#f0dfe6}.public.modern{--bg:#f1f5f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--line:#dbe3ec}.dark .hero{background:#111116}.soft .hero{border-radius:30px}.modern .hero{border-radius:12px}.modern .card{border-radius:12px}.dark .card{box-shadow:none}.public .wrap{width:min(1050px,100%)}.public .hero{margin-top:18px}.footer{padding:30px 0;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:850px){.grid,.masters{grid-template-columns:1fr 1fr}.admin{grid-template-columns:1fr}.side{position:static}.stats{grid-template-columns:1fr 1fr}.theme-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.wrap{padding:14px}.grid,.masters,.stats{grid-template-columns:1fr}.hero{padding:28px 20px;border-radius:22px}.top{align-items:flex-start}.table{font-size:13px}.hide-mobile{display:none}}
</style>
</head>
<body><div id="app"></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), app=$("#app"), modal=$("#modal"), toast=$("#toast");
let me=null, salon=null, masters=[], services=[], selectedService=null, selectedMaster=null, bookingStep=1, bookingDate=new Date().toISOString().slice(0,10), slots=[];
const money=n=>new Intl.NumberFormat("ru-RU").format(n)+" сум";
async function api(path,opt={}){const r=await fetch(path,{credentials:"include",headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||"Ошибка запроса");return d}
function toastMsg(s){toast.textContent=s;toast.classList.remove("hidden");setTimeout(()=>toast.classList.add("hidden"),2800)}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function themeClass(t){return ["light","dark","soft","modern"].includes(t)?t:"light"}
function publicUrl(){return location.pathname.match(/^\\/s\\/([^/]+)/)?.[1]}
async function boot(){
  const slug=publicUrl();
  if(slug){return renderPublic(slug)}
  try{me=await api("/api/me");return renderAdmin()}
  catch{renderLanding()}
}
function renderLanding(){app.innerHTML='<div class="wrap"><div class="top"><div class="brand"><div class="logo">S</div>SalonOS</div></div><section class="hero"><h1>Онлайн-запись, которую можно запустить за несколько минут.</h1><p>Свой салон, мастера, услуги, расписание и публичная страница — без программирования.</p><div class="row"><button class="btn" onclick="openAuth(\\'register\\')">Создать салон</button><button class="btn ghost" onclick="openAuth(\\'login\\')">Войти</button></div></section><div class="grid"><div class="card"><b>Онлайн-запись</b><p class="muted">Клиент сам выбирает услугу, мастера и свободное время.</p></div><div class="card"><b>4 дизайна</b><p class="muted">Light, Dark, Soft и Modern — салон выбирает свой стиль.</p></div><div class="card"><b>Управление</b><p class="muted">Записи, мастера, услуги, клиенты и расписание.</p></div></div></div>'}
function openAuth(mode){modal.classList.remove("hidden");modal.innerHTML='<div class="modalbox"><div class="top"><h2>'+(mode==="login"?"Вход":"Создание салона")+'</h2><button class="btn ghost small" onclick="closeModal()">Закрыть</button></div><form onsubmit="auth(event,\\''+mode+'\\')">'+(mode==="register"?'<label>Ваше имя</label><input id="an" required minlength="2"><label>Название салона</label><input id="sn" required minlength="2">':'')+'<label>Email</label><input id="ae" type="email" required><label>Пароль</label><input id="ap" type="password" required minlength="6"><button class="btn" style="width:100%;margin-top:18px">'+(mode==="login"?"Войти":"Создать салон")+'</button></form></div>'}
function closeModal(){modal.classList.add("hidden");modal.innerHTML=""}
async function auth(e,mode){e.preventDefault();try{if(mode==="login")await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:$("#ae").value,password:$("#ap").value})});else await api("/api/auth/register",{method:"POST",body:JSON.stringify({name:$("#an").value,email:$("#ae").value,password:$("#ap").value,salon_name:$("#sn").value})});closeModal();me=await api("/api/me");renderAdmin()}catch(x){toastMsg(x.message)}}
async function loadAdmin(){[salon,masters,services]=await Promise.all([api("/api/admin/salon"),api("/api/admin/masters"),api("/api/admin/services")])}
async function renderAdmin(){try{await loadAdmin()}catch(e){toastMsg(e.message);return}app.innerHTML='<div class="wrap"><div class="top"><div class="brand"><div class="logo">S</div>SalonOS</div><div class="row"><a class="btn ghost small" href="/s/'+esc(salon.slug)+'" target="_blank">Открыть салон</a><button class="btn ghost small" onclick="logout()">Выйти</button></div></div><div class="admin"><aside class="side card"><button class="navbtn active" data-page="dashboard" onclick="adminPage(\\'dashboard\\')">Главная</button><button class="navbtn" data-page="appointments" onclick="adminPage(\\'appointments\\')">Записи</button><button class="navbtn" data-page="masters" onclick="adminPage(\\'masters\\')">Мастера</button><button class="navbtn" data-page="services" onclick="adminPage(\\'services\\')">Услуги</button><button class="navbtn" data-page="clients" onclick="adminPage(\\'clients\\')">Клиенты</button><button class="navbtn" data-page="settings" onclick="adminPage(\\'settings\\')">Настройки</button></aside><main id="adminMain"></main></div></div>';adminPage("dashboard")}
async function adminPage(page){document.querySelectorAll(".navbtn").forEach(x=>x.classList.toggle("active",x.dataset.page===page));const m=$("#adminMain");if(page==="dashboard")return dashboard(m);if(page==="appointments")return appointmentsPage(m);if(page==="masters")return mastersPage(m);if(page==="services")return servicesPage(m);if(page==="clients")return clientsPage(m);if(page==="settings")return settingsPage(m)}
async function dashboard(m){const rows=await api("/api/admin/appointments");m.innerHTML='<h1>Добрый день, '+esc(me.name)+'</h1><p class="muted">'+esc(salon.name)+'</p><div class="stats"><div class="card stat"><span class="muted">Сегодня</span><b>'+rows.length+'</b><span class="muted">записей</span></div><div class="card stat"><span class="muted">Мастера</span><b>'+masters.filter(x=>x.is_active).length+'</b><span class="muted">активны</span></div><div class="card stat"><span class="muted">Услуги</span><b>'+services.filter(x=>x.is_active).length+'</b><span class="muted">активны</span></div></div><div class="section card"><div class="top"><h2>Сегодня</h2><button class="btn small" onclick="adminPage(\\'appointments\\')">Все записи</button></div>'+rows.slice(0,8).map(appointmentHtml).join("")+(rows.length?"":"<p class=\\"muted\\">На сегодня записей нет.</p>")+'</div>'}
function appointmentHtml(a){return '<div class="service card" style="box-shadow:none;padding:13px;margin-bottom:8px"><div><b>'+new Date(a.start_at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})+' · '+esc(a.client_name)+'</b><div class="muted">'+esc(a.service_name)+' · '+esc(a.master_name)+' · '+esc(a.client_phone)+'</div></div><div class="row"><span class="chip">'+esc(a.status)+'</span><button class="btn ghost small" onclick="editAppointment(\''+a.id+'\')">Изменить</button></div></div>'}
async function appointmentsPage(m){const rows=await api("/api/admin/appointments");m.innerHTML='<div class="top"><div><h1>Записи</h1><p class="muted">Сегодня, '+new Date().toLocaleDateString("ru-RU")+'</p></div></div><div class="card">'+(rows.length?rows.map(a=>appointmentHtml(a)+'<div class="row" style="margin-bottom:12px"><button class="btn small" onclick="setStatus(\\''+a.id+'\\',\\'completed\\')">Завершить</button><button class="btn danger small" onclick="setStatus(\\''+a.id+'\\',\\'cancelled\\')">Отменить</button></div>').join(""):'<p class="muted">Записей нет.</p>')+'</div>'}
async function editAppointment(id){const rows=await api("/api/admin/appointments");const a=rows.find(x=>x.id===id);if(!a)return;modal.classList.remove("hidden");const d=new Date(a.start_at);modal.innerHTML='<div class="modalbox"><div class="top"><h2>Изменить запись</h2><button class="btn ghost small" onclick="closeModal()">Закрыть</button></div><label>Клиент</label><input id="eaName" value="'+esc(a.client_name)+'"><label>Телефон</label><input id="eaPhone" value="'+esc(a.client_phone)+'"><label>Мастер</label><select id="eaMaster">'+masters.filter(m=>m.is_active).map(m=>'<option value="'+m.id+'" '+(m.id===a.master_id?"selected":"")+'>'+esc(m.name)+'</option>').join("")+'</select><label>Услуга</label><select id="eaService">'+services.filter(s=>s.is_active).map(s=>'<option value="'+s.id+'" '+(s.id===a.service_id?"selected":"")+'>'+esc(s.name)+'</option>').join("")+'</select><label>Дата и время</label><input id="eaStart" type="datetime-local" value="'+new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)+'"><label>Статус</label><select id="eaStatus">'+["confirmed","completed","cancelled","no_show"].map(s=>'<option '+(s===a.status?"selected":"")+'>'+s+'</option>').join("")+'</select><button class="btn" style="width:100%;margin-top:18px" onclick="saveAppointment(\''+id+'\')">Сохранить</button></div>'}
async function saveAppointment(id){try{await api("/api/admin/appointments/"+id,{method:"PUT",body:JSON.stringify({master_id:$("#eaMaster").value,service_id:$("#eaService").value,start_at:new Date($("#eaStart").value).toISOString(),client_name:$("#eaName").value,client_phone:$("#eaPhone").value,status:$("#eaStatus").value})});closeModal();toastMsg("Запись изменена");adminPage("appointments")}catch(e){toastMsg(e.message)}}
async function setStatus(id,status){try{await api("/api/admin/appointments/"+id+"?status="+status,{method:"PATCH"});toastMsg("Сохранено");adminPage("appointments")}catch(e){toastMsg(e.message)}}
async function mastersPage(m){m.innerHTML='<div class="top"><h1>Мастера</h1><button class="btn" onclick="masterForm()">Добавить</button></div><div class="grid">'+masters.map(x=>'<div class="card"><div class="row"><div class="avatar">'+esc(x.name[0]||"М")+'</div><div><b>'+esc(x.name)+'</b><p class="muted">'+esc(x.description||"")+'</p></div></div><div class="row" style="margin-top:12px"><button class="btn ghost small" onclick="masterForm(\\''+x.id+'\\')">Изменить</button><button class="btn ghost small" onclick="masterServices(\\''+x.id+'\\')">Услуги</button><button class="btn ghost small" onclick="masterSchedule(\\''+x.id+'\\')">График</button><button class="btn ghost small" onclick="createMasterLogin(\\''+x.id+'\\')">Доступ</button><button class="btn danger small" onclick="delMaster(\\''+x.id+'\\')">Скрыть</button></div></div>').join("")||'<div class="card"><p class="muted">Добавьте первого мастера.</p></div></div>'}
async function masterForm(id){const x=masters.find(a=>a.id===id)||{};modal.classList.remove("hidden");modal.innerHTML='<div class="modalbox"><div class="top"><h2>'+ (id?"Изменить":"Новый мастер")+'</h2><button class="btn ghost small" onclick="closeModal()">Закрыть</button></div><form onsubmit="saveMaster(event,\\''+(id||"")+'\\')"><label>Имя</label><input id="mn" required value="'+esc(x.name||"")+'"><label>Описание</label><textarea id="md">'+esc(x.description||"")+'</textarea><label>Телефон</label><input id="mp" value="'+esc(x.phone||"")+'"><label>Фото URL</label><input id="mu" value="'+esc(x.photo_url||"")+'"><button class="btn" style="width:100%;margin-top:18px">Сохранить</button></form></div>'}
async function saveMaster(e,id){e.preventDefault();const body={name:$("#mn").value,description:$("#md").value,phone:$("#mp").value,photo_url:$("#mu").value};try{await api("/api/admin/masters"+(id?"/"+id:""),{method:id?"PUT":"POST",body:JSON.stringify(body)});closeModal();await loadAdmin();adminPage("masters")}catch(x){toastMsg(x.message)}}
async function createMasterLogin(id){const email=prompt("Email мастера");if(!email)return;const password=prompt("Пароль (минимум 6 символов)");if(!password)return;try{await api("/api/auth/master",{method:"POST",body:JSON.stringify({master_id:id,email,password})});toastMsg("Доступ мастера создан")}catch(e){toastMsg(e.message)}}
async function masterServices(id){let ids=await api("/api/admin/masters/"+id+"/services");modal.classList.remove("hidden");modal.innerHTML='<div class="modalbox"><div class="top"><h2>Услуги мастера</h2><button class="btn ghost small" onclick="closeModal()">Закрыть</button></div><p class="muted">Выберите услуги.</p><div id="svcChecks">'+services.filter(s=>s.is_active).map(s=>'<label><input type="checkbox" value="'+s.id+'" '+(ids.includes(s.id)?"checked":"")+'> '+esc(s.name)+' — '+money(s.price)+'</label>').join("")+'</div><button class="btn" style="width:100%;margin-top:18px" onclick="saveMasterServices(\\''+id+'\\')">Сохранить</button></div>'}
async function saveMasterServices(id){const ids=[...document.querySelectorAll("#svcChecks input:checked")].map(x=>x.value);try{await api("/api/admin/masters/"+id+"/services",{method:"PUT",body:JSON.stringify({service_ids:ids})});closeModal();toastMsg("Услуги сохранены")}catch(e){toastMsg(e.message)}}
async function masterSchedule(id){const [rows,ex]=await Promise.all([api("/api/admin/schedules/"+id),api("/api/admin/schedules/"+id+"/exceptions")]);modal.classList.remove("hidden");modal.innerHTML='<div class="modalbox"><div class="top"><h2>График мастера</h2><button class="btn ghost small" onclick="closeModal()">Закрыть</button></div><div id="scheduleBox">'+rows.map((x,i)=>'<div class="card" style="margin-bottom:8px"><div class="row"><label style="flex:.7"><input type="checkbox" data-wd="'+x.weekday+'" '+(x.is_working?"checked":"")+'> '+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"][i]+'</label><input data-start="'+x.weekday+'" value="'+x.start_time+'"><input data-end="'+x.weekday+'" value="'+x.end_time+'"></div></div>').join("")+'</div><button class="btn" style="width:100%;margin-top:10px" onclick="saveMasterSchedule(\\''+id+'\\')">Сохранить график</button><hr><h3>Исключения</h3><div>'+ex.map(x=>'<div class="service"><span>'+x.date+' '+(x.is_day_off?"— выходной":(x.start_time+"–"+x.end_time))+'</span><button class="btn danger small" onclick="deleteException(\\''+id+'\\',\\''+x.id+'\\')">Удалить</button></div>').join("")+'</div><div class="row"><input id="exDate" type="date"><input id="exStart" type="time" value="10:00"><input id="exEnd" type="time" value="19:00"></div><label><input id="exOff" type="checkbox"> Выходной</label><button class="btn ghost" style="width:100%;margin-top:10px" onclick="addException(\\''+id+'\\')">Добавить исключение</button></div>'}
async function addException(id){if(!$("#exDate").value)return toastMsg("Выберите дату");try{await api("/api/admin/schedules/"+id+"/exceptions",{method:"POST",body:JSON.stringify({date:$("#exDate").value,start_time:$("#exStart").value,end_time:$("#exEnd").value,is_day_off:$("#exOff").checked})});toastMsg("Исключение добавлено");masterSchedule(id)}catch(e){toastMsg(e.message)}}
async function deleteException(id,eid){try{await api("/api/admin/schedules/"+id+"/exceptions/"+eid,{method:"DELETE"});masterSchedule(id)}catch(e){toastMsg(e.message)}}
async function saveMasterSchedule(id){const rows=[...document.querySelectorAll("#scheduleBox [data-wd]")].map(x=>{const wd=+x.dataset.wd;return {weekday:wd,is_working:x.checked,start_time:document.querySelector("[data-start='"+wd+"']").value,end_time:document.querySelector("[data-end='"+wd+"']").value}});try{await api("/api/admin/schedules/"+id,{method:"PUT",body:JSON.stringify(rows)});closeModal();toastMsg("График сохранён")}catch(e){toastMsg(e.message)}}
async function delMaster(id){if(!confirm("Скрыть мастера?"))return;await api("/api/admin/masters/"+id,{method:"DELETE"});await loadAdmin();adminPage("masters")}
async function servicesPage(m){m.innerHTML='<div class="top"><h1>Услуги</h1><button class="btn" onclick="serviceForm()">Добавить</button></div><div class="card">'+services.map(x=>'<div class="service '+(x.is_active?"":"muted")+'"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.description||"")+' · '+x.duration_minutes+' мин</div></div><div class="row"><span class="price">'+money(x.price)+'</span><button class="btn ghost small" onclick="serviceForm(\\''+x.id+'\\')">Изменить</button><button class="btn danger small" onclick="delService(\\''+x.id+'\\')">Скрыть</button></div></div>').join("")||'<p class="muted">Добавьте первую услугу.</p>'+'</div>'}
async function serviceForm(id){const x=services.find(a=>a.id===id)||{};modal.classList.remove("hidden");modal.innerHTML='<div class="modalbox"><div class="top"><h2>'+ (id?"Изменить":"Новая услуга")+'</h2><button class="btn ghost small" onclick="closeModal()">Закрыть</button></div><form onsubmit="saveService(event,\\''+(id||"")+'\\')"><label>Название</label><input id="uv" required value="'+esc(x.name||"")+'"><label>Описание</label><textarea id="ud">'+esc(x.description||"")+'</textarea><div class="row"><div><label>Цена, сум</label><input id="up" type="number" min="0" required value="'+(x.price||0)+'"></div><div><label>Длительность, мин</label><input id="ut" type="number" min="15" max="480" required value="'+(x.duration_minutes||60)+'"></div></div><button class="btn" style="width:100%;margin-top:18px">Сохранить</button></form></div>'}
async function saveService(e,id){e.preventDefault();const body={name:$("#uv").value,description:$("#ud").value,price:+$("#up").value,duration_minutes:+$("#ut").value};try{await api("/api/admin/services"+(id?"/"+id:""),{method:id?"PUT":"POST",body:JSON.stringify(body)});closeModal();await loadAdmin();adminPage("services")}catch(x){toastMsg(x.message)}}
async function delService(id){if(!confirm("Скрыть услугу?"))return;await api("/api/admin/services/"+id,{method:"DELETE"});await loadAdmin();adminPage("services")}
async function clientsPage(m){const rows=await api("/api/admin/clients");m.innerHTML='<h1>Клиенты</h1><div class="card"><table class="table"><thead><tr><th>Имя</th><th>Телефон</th><th>Записей</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+x.appointments_count+'</td></tr>').join("")+'</tbody></table></div>'}
function settingsPage(m){m.innerHTML='<h1>Настройки</h1><div class="card"><form onsubmit="saveSettings(event)"><label>Название</label><input id="ssn" value="'+esc(salon.name)+'"><label>Описание</label><textarea id="ssd">'+esc(salon.description||"")+'</textarea><div class="row"><div><label>Телефон</label><input id="ssp" value="'+esc(salon.phone||"")+'"></div><div><label>Адрес</label><input id="ssa" value="'+esc(salon.address||"")+'"></div></div><label>Логотип URL</label><input id="ssl" value="'+esc(salon.logo_url||"")+'"><label>Акцентный цвет</label><input id="ssc" type="color" value="'+esc(salon.accent_color||"#7c3aed")+'"><label>Дизайн</label><div class="theme-grid">'+["light","dark","soft","modern"].map(t=>'<label class="theme '+(salon.theme===t?"active":"")+'"><input type="radio" name="theme" value="'+t+'" '+(salon.theme===t?"checked":"")+'>'+t.toUpperCase()+'</label>').join("")+'</div><p class="muted">Публичная ссылка: /s/'+esc(salon.slug)+'</p><button class="btn">Сохранить</button></form></div>'}
async function saveSettings(e){e.preventDefault();const theme=document.querySelector('input[name="theme"]:checked').value;try{salon=await api("/api/admin/salon",{method:"PUT",body:JSON.stringify({name:$("#ssn").value,description:$("#ssd").value,phone:$("#ssp").value,address:$("#ssa").value,logo_url:$("#ssl").value,accent_color:$("#ssc").value,theme})});toastMsg("Настройки сохранены");adminPage("settings")}catch(x){toastMsg(x.message)}}
async function logout(){await api("/api/auth/logout",{method:"POST"});me=null;renderLanding()}
async function renderPublic(slug){try{salon=await api("/api/public/"+slug);masters=salon.masters;services=salon.services;document.body.className="public "+themeClass(salon.theme);document.documentElement.style.setProperty("--accent",salon.accent_color||"#7c3aed");app.innerHTML='<div class="wrap"><div class="top"><div class="brand">'+(salon.logo_url?'<img class="logo" src="'+esc(salon.logo_url)+'">':'<div class="logo">'+esc((salon.name||"S")[0])+'</div>')+'<span>'+esc(salon.name)+'</span></div><a class="btn small" href="#booking" onclick="openBooking()">Записаться</a></div><section class="hero"><h1>'+esc(salon.name)+'</h1><p>'+esc(salon.description||"Онлайн-запись на услуги салона.")+'</p><p class="muted">'+esc(salon.address||"")+(salon.phone?" · "+esc(salon.phone):"")+'</p></section><section class="section"><h2>Услуги</h2><div class="grid">'+services.map(s=>'<div class="card service"><div><b>'+esc(s.name)+'</b><div class="muted">'+s.duration_minutes+' мин</div></div><span class="price">'+money(s.price)+'</span></div>').join("")+'</div></section><section class="section"><h2>Мастера</h2><div class="masters">'+masters.map(x=>(x.photo_url?'<img class="master img" src="'+esc(x.photo_url)+'">':'<div class="avatar">'+esc((x.name||"M")[0])+'</div>')+'<strong>'+esc(x.name)+'</strong><p class="muted">'+esc(x.description||"")+'</p>').join("")+'</div></section><div class="footer">Powered by SalonOS</div></div>'}catch(e){app.innerHTML='<div class="wrap"><div class="card"><h2>Салон не найден</h2><p class="muted">'+esc(e.message)+'</p></div></div>'}}
function openBooking(){bookingStep=1;selectedService=null;selectedMaster=null;bookingDate=new Date().toISOString().slice(0,10);renderBooking()}
function renderBooking(){modal.classList.remove("hidden");let body="";if(bookingStep===1)body='<h3>Выберите услугу</h3><div class="grid">'+services.map(s=>'<button class="card" style="text-align:left;border:2px solid '+(selectedService?.id===s.id?"var(--accent)":"var(--line)")+'" onclick="pickService(\\''+s.id+'\\')"><b>'+esc(s.name)+'</b><p class="muted">'+s.duration_minutes+' мин</p><strong>'+money(s.price)+'</strong></button>').join("")+'</div>';if(bookingStep===2)body='<h3>Выберите мастера</h3><div class="grid">'+masters.filter(m=>salon.master_services.some(x=>x.master_id===m.id&&x.service_id===selectedService.id)).map(x=>'<button class="card" style="text-align:left;border:2px solid '+(selectedMaster?.id===x.id?"var(--accent)":"var(--line)")+'" onclick="pickMaster(\\''+x.id+'\\')"><b>'+esc(x.name)+'</b><p class="muted">'+esc(x.description||"")+'</p></button>').join("")+'</div>';if(bookingStep===3)body='<h3>Дата и время</h3><label>Дата</label><input id="bd" type="date" min="'+new Date().toISOString().slice(0,10)+'" value="'+bookingDate+'" onchange="bookingDate=this.value;loadSlots()"><div id="slotBox" class="chips" style="margin-top:15px">Загрузка…</div>';if(bookingStep===4)body='<h3>Ваши данные</h3><label>Имя</label><input id="bn" required><label>Телефон</label><input id="bp" required placeholder="+998 90 123 45 67"><div class="card" style="margin-top:16px"><b>'+esc(selectedService.name)+'</b><p class="muted">'+esc(selectedMaster.name)+' · '+bookingDate+' · '+slots.find(x=>x===window.selectedSlot)+'</p><strong>'+money(selectedService.price)+'</strong></div>';modal.innerHTML='<div class="modalbox"><div class="top"><h2>Запись</h2><button class="btn ghost small" onclick="closeModal()">Закрыть</button></div><div class="steps">'+[1,2,3,4].map(x=>'<div class="step '+(x<=bookingStep?"on":"")+'"></div>').join("")+'</div>'+body+'<div class="row" style="margin-top:20px">'+(bookingStep>1?'<button class="btn ghost" onclick="bookingStep--;renderBooking()">Назад</button>':"")+(bookingStep<4?'<button class="btn" onclick="nextBooking()">Продолжить</button>':'<button class="btn" onclick="submitBooking()">Подтвердить запись</button>')+'</div></div>';if(bookingStep===3)loadSlots()}
function pickService(id){selectedService=services.find(x=>x.id===id);renderBooking()}
function pickMaster(id){selectedMaster=masters.find(x=>x.id===id);renderBooking()}
async function loadSlots(){const box=$("#slotBox");if(!box)return;box.textContent="Загрузка…";try{const d=await api("/api/public/"+salon.slug+"/slots?service_id="+selectedService.id+"&master_id="+selectedMaster.id+"&day="+bookingDate);slots=d.slots;box.innerHTML=slots.length?slots.map(x=>'<button class="chip '+(window.selectedSlot===x?"active":"")+'" onclick="window.selectedSlot=\\''+x+'\\';renderBooking()">'+x+'</button>').join(""):'<span class="muted">На этот день свободного времени нет.</span>'}catch(e){box.textContent=e.message}}
function nextBooking(){if(bookingStep===1&&!selectedService)return toastMsg("Выберите услугу");if(bookingStep===2&&!selectedMaster)return toastMsg("Выберите мастера");if(bookingStep===3&&!window.selectedSlot)return toastMsg("Выберите время");bookingStep++;renderBooking()}
async function submitBooking(){if(!$("#bn").value||!$("#bp").value)return toastMsg("Заполните имя и телефон");const start=bookingDate+"T"+window.selectedSlot+":00";try{const r=await api("/api/public/"+salon.slug+"/appointments",{method:"POST",body:JSON.stringify({master_id:selectedMaster.id,service_id:selectedService.id,start_at:start,client_name:$("#bn").value,client_phone:$("#bp").value})});modal.innerHTML='<div class="modalbox" style="text-align:center"><div class="logo" style="margin:auto">✓</div><h2>Запись подтверждена</h2><p class="muted">'+esc(r.service)+' · '+esc(r.master)+'</p><p>'+new Date(r.start_at).toLocaleString("ru-RU",{dateStyle:"long",timeStyle:"short"})+'</p><button class="btn" onclick="closeModal()">Готово</button></div>'}catch(e){toastMsg(e.message)}}
boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
